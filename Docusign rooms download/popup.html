<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docusign Rooms Bulk Downloader</title>
  <style>
    body {
      width: 310px;
      margin: 0;
      padding: 14px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .status {
      background: #222;
      border-radius: 8px;
      padding: 9px;
      min-height: 34px;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .progress {
      color: #ddd;
      margin-bottom: 10px;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      font-weight: 700;
    }
    #start { background: #b00020; color: #fff; }
    #pause { background: #f5a623; color: #111; }
    #resume { background: #0a7; color: #fff; }
    #stop { background: #555; color: #fff; }
    .credit {
      color: #888;
      margin-top: 8px;
      font-size: 9px;
      line-height: 1;
      text-align: center;
      letter-spacing: .2px;
      text-transform: lowercase;
    }
    .note {
      color: #bbb;
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="title">Docusign Bulk Downloader</div>
  <div class="status" id="status">Open the main Docusign Rooms list page, then click Start.</div>
  <div class="progress" id="progress">0 / 0</div>

  <div class="buttons">
    <button id="start">Start</button>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="stop">Stop</button>
  </div>

  <div class="credit">created by Miguel Chica</div>
  <div class="note">
    Saves as:<br>
    Downloads / Docusign Rooms / Room Name / Room Name.zip
  </div>

  <script src="popup.js"></script>
</body>
</html>
